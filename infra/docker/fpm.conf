[global]
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid
[www]
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
ping.path = /ping
ping.response = pong
