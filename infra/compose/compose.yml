name: ${COMPOSE_PROJECT_NAME:-kirh-geo}

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

x-app: &app
  <<: *common
  image: ${API_IMAGE:-kirh-geo-api:local}
  env_file: ${APP_ENV_FILE:-../../apps/api/.env}
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [application, data]
  volumes:
    - app_storage:/app/storage

services:
  api:
    <<: *app
  worker:
    <<: *app
    command: [php, artisan, queue:work, redis, "--queue=sos,billing,locations,notifications,default", "--sleep=1", "--tries=5", "--timeout=90", "--max-time=3600"]
    stop_grace_period: 100s
    healthcheck:
      test: [CMD-SHELL, "kill -0 1 && php artisan about --only=environment >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    <<: *app
    command: [php, artisan, schedule:work]
    healthcheck:
      test: [CMD-SHELL, "kill -0 1 && php artisan about --only=environment >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
  reverb:
    <<: *app
    command: [php, artisan, reverb:start, "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: [CMD-SHELL, "php -r '$$s = @fsockopen(\"127.0.0.1\", 8080); exit($$s ? 0 : 1);'"]
      interval: 20s
      timeout: 5s
      retries: 3
  proxy:
    <<: *common
    image: ${PROXY_IMAGE:-kirh-geo-proxy:local}
    depends_on:
      api: { condition: service_healthy }
      reverb: { condition: service_healthy }
    networks: [application]
  share:
    <<: *common
    image: ${SHARE_IMAGE:-kirh-geo-share:local}
    networks: [application]
  postgres:
    <<: *common
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kirh_geo}
      POSTGRES_USER: kirh_migrator
      POSTGRES_PASSWORD: ${MIGRATOR_PASSWORD:?Set migration role password}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set runtime role password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sh:/docker-entrypoint-initdb.d/20-kirh.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kirh_migrator -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [data]
  redis:
    <<: *common
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [data]

volumes:
  postgres_data:
  redis_data:
  app_storage:
networks:
  application:
  data:
    internal: true
