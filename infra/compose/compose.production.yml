x-app-security: &app-security
  read_only: true
  cap_drop: [ALL]
  user: "10001:10001"
  tmpfs:
    - /tmp:noexec,nosuid,size=64m
    - /app/bootstrap/cache:uid=10001,gid=10001,nosuid,size=16m
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128
services:
  api:
    <<: *app-security
    environment: { APP_ENV: production, APP_DEBUG: "false", LOG_CHANNEL: stderr }
  worker:
    <<: *app-security
    environment: { APP_ENV: production, APP_DEBUG: "false", LOG_CHANNEL: stderr }
  scheduler:
    <<: *app-security
    mem_limit: 256m
    environment: { APP_ENV: production, APP_DEBUG: "false", LOG_CHANNEL: stderr }
  reverb:
    <<: *app-security
    environment: { APP_ENV: production, APP_DEBUG: "false", LOG_CHANNEL: stderr }
  proxy:
    read_only: true
    cap_drop: [ALL]
    user: "101:101"
    tmpfs: ["/tmp:noexec,nosuid,size=64m"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # Existing host reverse proxy terminates TLS; never replace other projects' virtual hosts.
    ports: ["127.0.0.1:${HTTP_PORT:-18080}:8080"]
  share:
    read_only: true
    cap_drop: [ALL]
    user: "101:101"
    tmpfs: ["/tmp:noexec,nosuid,size=32m"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    ports: ["127.0.0.1:${SHARE_HTTP_PORT:-18081}:8080"]
  postgres:
    # Official entrypoint needs chown/setuid for first initialization of named volume.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=64m", "/var/run/postgresql:nosuid,size=16m"]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    shm_size: 256m
  redis:
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=16m"]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
